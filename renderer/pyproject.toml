# 文件功能：独立 Renderer 执行服务的构建元数据与依赖锁定入口。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-presentation-renderer"
version = "0.1.0"
description = "远程渲染执行服务：单槽异步 Playwright Chromium"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.1",
    "uvicorn[standard]>=0.47.0",
    "pydantic-settings>=2.14.1",
    "playwright>=1.60.0",
    "httpx>=0.28.1",
    "render-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.uv.sources]
render-contracts = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["wp_renderer"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Renderer 控制面与契约测试。",
]
