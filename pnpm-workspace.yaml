# 文件功能：根级 pnpm workspace 清单，统管根工具链、editor 与 runtime 的依赖与锁文件。
packages:
  - editor
  - runtime

allowBuilds:
  vue-demi: true

overrides:
  dompurify: ^3.4.5
  js-cookie: ^3.0.7
  brace-expansion: ^5.0.6
  flatted: ^3.4.2
  glob: ^10.5.0
  js-yaml: ^4.1.1
  lodash: ^4.18.1
  minimatch: ^10.2.5
  picomatch: ^4.0.4
  ajv: ^6.14.0

onlyBuiltDependencies:
  - vue-demi
