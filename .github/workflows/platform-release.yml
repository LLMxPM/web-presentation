# 文件功能：平台 Release 流水线。复用质量门禁后，由本仓构建并推送 Runtime / Renderer / 平台 / SQLite lite 镜像。
# Runtime 镜像自 vendored 起由本仓 runtime/Dockerfile 构建，不再依赖外部 web-runtime-vue 子模块 SHA 镜像。

name: platform-release

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布到 Docker Hub 的镜像标签，例如 v1.2.3
        required: true
        type: string
      push_latest:
        description: 是否同时推送 latest 标签
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:
      - id: meta
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            release_tag="${EVENT_RELEASE_TAG}"
            if [ "${EVENT_RELEASE_PRERELEASE}" = "true" ]; then
              push_latest="false"
            else
              push_latest="true"
            fi
          else
            release_tag="${INPUT_RELEASE_TAG}"
            push_latest="${INPUT_PUSH_LATEST}"
          fi

          if [ -z "${release_tag}" ]; then
            echo "release_tag 不能为空。" >&2
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: release-meta
    uses: ./.github/workflows/reusable-quality.yml
    with:
      full: true
      run_runtime: true
      e2e_scope: all

  build-and-push-services:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            image: web-runtime-vue
            file: runtime/Dockerfile
            description: web-presentation Runtime Vite server image
          - name: renderer
            image: web-presentation-renderer
            file: renderer/Dockerfile
            description: web-presentation remote Chromium Renderer image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/check-image
        with:
          file: ${{ matrix.file }}
          variant: ${{ matrix.name }}
          tag: wp-service:startup-${{ matrix.name }}
          cache-scope: ${{ matrix.name }}
      - id: meta-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: docker.io/llmxpm/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - id: meta-acr
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
            type=sha,format=long,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Push service image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          annotations: ${{ steps.meta-dockerhub.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Push service image to ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          annotations: ${{ steps.meta-acr.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - quality
      - build-and-push-services
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/check-image
        with:
          file: deploy/docker/Dockerfile.platform
          variant: full
          tag: web-presentation:startup
          cache-scope: platform
      # Docker Hub 支持 BuildKit attestation，保留 provenance/SBOM。
      - id: meta-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: docker.io/llmxpm/web-presentation
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-presentation
            org.opencontainers.image.description=web-presentation Backend and Editor platform image
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.web-presentation.runtime.image=docker.io/llmxpm/web-runtime-vue:${{ needs.release-meta.outputs.release_tag }}
            com.web-presentation.renderer.image=docker.io/llmxpm/web-presentation-renderer:${{ needs.release-meta.outputs.release_tag }}
      # 个人版/旧版 ACR 不接受 provenance 和 SBOM 生成的 OCI 附件，单独生成 ACR 标签。
      - id: meta-acr
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/web-presentation
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-presentation
            org.opencontainers.image.description=web-presentation Backend and Editor platform image
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.web-presentation.runtime.image=docker.io/llmxpm/web-runtime-vue:${{ needs.release-meta.outputs.release_tag }}
            com.web-presentation.renderer.image=docker.io/llmxpm/web-presentation-renderer:${{ needs.release-meta.outputs.release_tag }}
      - name: Push platform image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.platform
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          annotations: ${{ steps.meta-dockerhub.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform
      - name: Push platform image to ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.platform
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          annotations: ${{ steps.meta-acr.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=platform
          cache-to: type=gha,mode=max,scope=platform

  build-and-push-lite:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - quality
      - build-and-push-services
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: ./.github/actions/check-image
        with:
          file: deploy/docker/Dockerfile.lite
          variant: lite
          tag: web-presentation:lite-startup
          cache-scope: platform-lite
      # Docker Hub 支持 BuildKit attestation，保留 provenance/SBOM。
      - id: meta-dockerhub
        uses: docker/metadata-action@v6
        with:
          images: docker.io/llmxpm/web-presentation
          tags: |
            type=raw,value=sqlite-lite-${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=sqlite-lite,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-presentation-sqlite-lite
            org.opencontainers.image.description=web-presentation SQLite + memory runtime single-container image
            org.opencontainers.image.version=sqlite-lite-${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.web-presentation.image.variant=sqlite-lite
            com.web-presentation.runtime.embedded=true
      # 个人版/旧版 ACR 不接受 provenance 和 SBOM 生成的 OCI 附件，单独生成 ACR 标签。
      - id: meta-acr
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/web-presentation
          tags: |
            type=raw,value=sqlite-lite-${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=sqlite-lite,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-presentation-sqlite-lite
            org.opencontainers.image.description=web-presentation SQLite + memory runtime single-container image
            org.opencontainers.image.version=sqlite-lite-${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            com.web-presentation.image.variant=sqlite-lite
            com.web-presentation.runtime.embedded=true
      - name: Push SQLite lite image to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          annotations: ${{ steps.meta-dockerhub.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=platform-lite
          cache-to: type=gha,mode=max,scope=platform-lite
      - name: Push SQLite lite image to ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile.lite
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          annotations: ${{ steps.meta-acr.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=platform-lite
          cache-to: type=gha,mode=max,scope=platform-lite
