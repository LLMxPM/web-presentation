# 文件功能：平台 Release 流水线。校验该提交已在 main 通过质量门禁后，由本仓单次多架构构建并推送 Runtime / Renderer / 平台 / SQLite lite 镜像。
# 不再重复执行整套质量门禁：门禁结论由 platform-test 在 main 上产出，本流水线只做镜像启动验证与推送。

name: platform-release

permissions:
  contents: read
  # verify-main-gate 需要读取 platform-test 的运行结论。
  actions: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布到 Docker Hub 的镜像标签，例如 v1.2.3
        required: true
        type: string
      push_latest:
        description: 是否同时推送 latest 标签
        required: true
        default: false
        type: boolean
      allow_unverified:
        description: 跳过「该提交在 main 已全绿」校验（仅用于紧急补发，会写入告警）
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
    steps:
      - id: meta
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
          DOCKER_USERNAME: ${{ vars.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
          ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
          ACR_USERNAME: ${{ vars.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            release_tag="${EVENT_RELEASE_TAG}"
            if [ "${EVENT_RELEASE_PRERELEASE}" = "true" ]; then
              push_latest="false"
            else
              push_latest="true"
            fi
          else
            release_tag="${INPUT_RELEASE_TAG}"
            push_latest="${INPUT_PUSH_LATEST}"
          fi

          if [ -z "${release_tag}" ]; then
            echo "release_tag 不能为空。" >&2
            exit 1
          fi

          # 发布凭证与仓库变量在此一次性校验，避免缺配置时在 docker login/build 阶段才报出难以定位的错误。
          missing=""
          for pair in "vars.DOCKER_USERNAME:${DOCKER_USERNAME}" \
                      "secrets.DOCKER_PASSWORD:${DOCKER_PASSWORD}" \
                      "vars.ACR_REGISTRY:${ACR_REGISTRY}" \
                      "vars.ACR_NAMESPACE:${ACR_NAMESPACE}" \
                      "vars.ACR_USERNAME:${ACR_USERNAME}" \
                      "secrets.ACR_PASSWORD:${ACR_PASSWORD}"; do
            [ -z "${pair#*:}" ] && missing="${missing} ${pair%%:*}"
          done
          if [ -n "${missing}" ]; then
            echo "缺少发布所需的配置项：${missing}" >&2
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"

  # 发布不再重跑整套门禁：改为复用 platform-test 在同一提交上产出的结论，
  # 使 main push 的 ~20 分钟门禁不会被同一条提交在发布链路上重复一次。
  verify-main-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-meta
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.sha }}
      ALLOW_UNVERIFIED: ${{ inputs.allow_unverified }}
    steps:
      - name: 校验该提交已通过 platform-test 全部门禁
        run: |
          conclusions="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=100" \
            --jq '.workflow_runs[] | select(.name == "platform-test" and .status == "completed") | .conclusion' || true)"

          if printf '%s\n' "${conclusions}" | grep -qx success; then
            echo "提交 ${HEAD_SHA} 已有通过的 platform-test 运行，允许发布。"
            exit 0
          fi

          if [ "${ALLOW_UNVERIFIED}" = "true" ]; then
            echo "::warning::提交 ${HEAD_SHA} 没有通过的质量门禁运行，已按 allow_unverified 跳过校验。"
            exit 0
          fi

          in_progress="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${HEAD_SHA}&per_page=10" \
            --jq '.workflow_runs[] | select(.name == "platform-test" and .status != "completed") | .id' || true)"

          {
            echo "提交 ${HEAD_SHA} 没有通过的 platform-test 运行，拒绝发布镜像。"
            echo "现有已完成结论：${conclusions:-无}"
            if [ -n "${in_progress}" ]; then
              echo "提示：该提交存在正在执行中的 platform-test（Run ID: ${in_progress}），请等待其完成且跑绿后再触发发布。"
            fi
            echo "确需紧急补发时，请通过 GitHub Actions 页面的 workflow_dispatch 手动触发并勾选 allow_unverified（GitHub Release 页面发布不支持跳过参数）。"
          } >&2
          exit 1

  publish-service-images:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - release-meta
      - verify-main-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: runtime
            image: web-runtime-vue
            file: runtime/Dockerfile
            cache_scope: runtime
            title: web-runtime-vue
            description: web-presentation Runtime Vite server image
            sha_tag: 'true'
            tag_style: version
            extra_labels: ''
          - variant: renderer
            image: web-presentation-renderer
            file: renderer/Dockerfile
            cache_scope: renderer
            title: web-presentation-renderer
            description: web-presentation remote Chromium Renderer image
            sha_tag: 'true'
            tag_style: version
            extra_labels: ''
    name: publish-service-images (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-image
        with:
          file: ${{ matrix.file }}
          variant: ${{ matrix.variant }}
          image: ${{ matrix.image }}
          cache-scope: ${{ matrix.cache_scope }}
          tag-version: ${{ needs.release-meta.outputs.release_tag }}
          push-latest: ${{ needs.release-meta.outputs.push_latest }}
          tag-style: ${{ matrix.tag_style }}
          sha-tag: ${{ matrix.sha_tag }}
          title: ${{ matrix.title }}
          description: ${{ matrix.description }}
          docker-username: ${{ vars.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          acr-registry: ${{ vars.ACR_REGISTRY }}
          acr-namespace: ${{ vars.ACR_NAMESPACE }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-password: ${{ secrets.ACR_PASSWORD }}

  publish-platform-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - release-meta
      - verify-main-gate
      - publish-service-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            image: web-presentation
            file: deploy/docker/Dockerfile.platform
            cache_scope: platform
            title: web-presentation
            description: web-presentation Backend and Editor platform image
            sha_tag: 'false'
            tag_style: version
            extra_labels: |
              com.web-presentation.runtime.image=docker.io/llmxpm/web-runtime-vue:${{ needs.release-meta.outputs.release_tag }}
              com.web-presentation.renderer.image=docker.io/llmxpm/web-presentation-renderer:${{ needs.release-meta.outputs.release_tag }}
          - variant: lite
            image: web-presentation
            file: deploy/docker/Dockerfile.lite
            cache_scope: platform-lite
            title: web-presentation-sqlite-lite
            description: web-presentation SQLite + memory runtime single-container image
            sha_tag: 'false'
            tag_style: sqlite-lite
            extra_labels: |
              com.web-presentation.image.variant=sqlite-lite
              com.web-presentation.runtime.embedded=true
    name: publish-platform-images (${{ matrix.variant }})
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish-image
        with:
          file: ${{ matrix.file }}
          variant: ${{ matrix.variant }}
          image: ${{ matrix.image }}
          cache-scope: ${{ matrix.cache_scope }}
          tag-version: ${{ needs.release-meta.outputs.release_tag }}
          push-latest: ${{ needs.release-meta.outputs.push_latest }}
          tag-style: ${{ matrix.tag_style }}
          sha-tag: ${{ matrix.sha_tag }}
          title: ${{ matrix.title }}
          description: ${{ matrix.description }}
          extra-labels: ${{ matrix.extra_labels }}
          docker-username: ${{ vars.DOCKER_USERNAME }}
          docker-password: ${{ secrets.DOCKER_PASSWORD }}
          acr-registry: ${{ vars.ACR_REGISTRY }}
          acr-namespace: ${{ vars.ACR_NAMESPACE }}
          acr-username: ${{ vars.ACR_USERNAME }}
          acr-password: ${{ secrets.ACR_PASSWORD }}
