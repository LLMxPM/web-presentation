# 文件功能：平台 PR / main / 定时质量门禁入口，按 git diff 分级触发，复用 reusable-quality，并只重建受影响的交付镜像。

name: platform-test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 每周一 03:00（Asia/Shanghai）执行一次全量门禁。
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 是否执行全量测试（包含 integration、E2E 和镜像构建 smoke）
        required: true
        default: true
        type: boolean

permissions:
  contents: read

# 定时全量门禁使用独立分组且不自增取消，避免被随后的 main push 中途杀掉。
concurrency:
  group: ${{ github.event_name == 'schedule' && format('{0}-schedule-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  # 由 .github/scripts/resolve-test-scope.sh 依据事件与 diff 决定门禁范围，不在 YAML 里维护第二份路径清单。
  test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
      run_runtime: ${{ steps.scope.outputs.run_runtime }}
      e2e_scope: ${{ steps.scope.outputs.e2e_scope }}
      image_matrix: ${{ steps.scope.outputs.image_matrix }}
    steps:
      # fetch-depth: 0 是为了拿到 diff base；缺失时脚本会保守升级为全量而不是跳过检查。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FULL_TESTS: ${{ inputs.full_tests }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/resolve-test-scope.sh

  quality:
    needs: test-scope
    timeout-minutes: 60
    uses: ./.github/workflows/reusable-quality.yml
    with:
      full: ${{ needs.test-scope.outputs.full_tests == 'true' }}
      run_runtime: ${{ needs.test-scope.outputs.run_runtime == 'true' }}
      e2e_scope: ${{ needs.test-scope.outputs.e2e_scope }}

  platform-image-build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 只依赖 test-scope：与 quality 并行，main push 的总时长不会被镜像构建串到门禁之后。
    needs:
      - test-scope
    if: needs.test-scope.outputs.image_matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        # 当 image_matrix 为空时提供 dummy 回退，避免 GHA 在 job 预校验阶段因 include 为空数组而语法报错。
        include: ${{ fromJSON(needs.test-scope.outputs.image_matrix == '[]' && '[{"name":"none"}]' || needs.test-scope.outputs.image_matrix) }}
    name: platform-image-build-smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # main push 与 PR 只验证 amd64；定时与手动全量运行再覆盖多架构。
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
      # 多架构构建后单独加载 amd64 产物，验证实际入口和健康探针。
      - uses: ./.github/actions/check-image
        with:
          file: ${{ matrix.file }}
          variant: ${{ matrix.name }}
          tag: ${{ matrix.tag }}
          cache-scope: ${{ matrix.cache_scope }}

  # CLI 跨仓契约依赖外部仓库，降级为定时/手动，不阻塞 PR 与 main 门禁。
  cli-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: web-presentation
      - uses: actions/checkout@v4
        with:
          repository: LLMxPM/web-presentation-agent-kit
          path: web-presentation-agent-kit
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - run: uv sync --project web-presentation/backend --group dev --locked
      - run: uv sync --project web-presentation-agent-kit --all-packages
      - working-directory: web-presentation
        run: pnpm run test:contracts:cli-skill
      - working-directory: web-presentation-agent-kit
        run: uv run pytest packages/cli/tests/test_backend_openapi_contract.py
