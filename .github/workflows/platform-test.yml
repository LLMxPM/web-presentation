# 文件功能：平台 PR / main / 定时质量门禁入口，复用 reusable-quality，并附加镜像 build smoke 与 CLI 契约。

name: platform-test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 每周一 03:00（Asia/Shanghai）执行一次全量门禁。
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 是否执行全量测试（包含 integration、E2E 和镜像构建 smoke）
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-scope:
    runs-on: ubuntu-latest
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
      e2e_scope: ${{ steps.scope.outputs.e2e_scope }}
    steps:
      - id: scope
        env:
          FULL_TESTS: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.full_tests) }}
        run: |
          echo "full_tests=${FULL_TESTS}" >> "${GITHUB_OUTPUT}"
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "e2e_scope=all" >> "${GITHUB_OUTPUT}"
          else
            echo "e2e_scope=smoke" >> "${GITHUB_OUTPUT}"
          fi

  detect-runtime-change:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.filter.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime_changed:
              - 'runtime'
              - 'runtime/**'

  quality:
    needs:
      - test-scope
      - detect-runtime-change
    uses: ./.github/workflows/reusable-quality.yml
    with:
      full: ${{ needs.test-scope.outputs.full_tests == 'true' }}
      run_runtime: ${{ needs.test-scope.outputs.full_tests == 'true' || needs.detect-runtime-change.outputs.runtime_changed == 'true' }}
      e2e_scope: ${{ needs.test-scope.outputs.e2e_scope }}

  platform-image-build-smoke:
    runs-on: ubuntu-latest
    needs:
      - test-scope
      - quality
    if: needs.test-scope.outputs.full_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            file: deploy/docker/Dockerfile.platform
            context: .
            tag: web-presentation:ci-smoke
            cache_scope: platform
          - name: lite
            file: deploy/docker/Dockerfile.lite
            context: .
            tag: web-presentation:sqlite-lite-ci-smoke
            cache_scope: platform-lite
          - name: runtime
            file: runtime/Dockerfile
            context: .
            tag: web-runtime-vue:ci-smoke
            cache_scope: runtime
    name: platform-image-build-smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      # main push 只验证 amd64；定时/手动全量运行时再覆盖多架构。
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  # CLI 跨仓契约依赖外部仓库，降级为定时/手动，不阻塞 PR 与 main 门禁。
  cli-contract:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web-presentation
      - uses: actions/checkout@v4
        with:
          repository: LLMxPM/web-presentation-agent-kit
          path: web-presentation-agent-kit
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - run: uv sync --project web-presentation/backend --group dev --locked
      - run: uv sync --project web-presentation-agent-kit --all-packages
      - working-directory: web-presentation
        run: pnpm run test:contracts:cli-skill
      - working-directory: web-presentation-agent-kit
        run: uv run pytest packages/cli/tests/test_backend_openapi_contract.py
