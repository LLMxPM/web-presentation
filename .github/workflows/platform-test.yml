name: platform-test

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 每周一 03:00（Asia/Shanghai）执行一次全量门禁。
    - cron: '0 19 * * 0'
  workflow_dispatch:
    inputs:
      full_tests:
        description: 是否执行全量测试（包含 integration、E2E 和镜像构建 smoke）
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-scope:
    runs-on: ubuntu-latest
    outputs:
      full_tests: ${{ steps.scope.outputs.full_tests }}
    steps:
      - id: scope
        env:
          FULL_TESTS: ${{ github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.full_tests) }}
        run: echo "full_tests=${FULL_TESTS}" >> "${GITHUB_OUTPUT}"

  detect-runtime-change:
    runs-on: ubuntu-latest
    outputs:
      runtime_changed: ${{ steps.filter.outputs.runtime_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runtime_changed:
              - 'runtime'
              - 'runtime/**'
              - '.gitmodules'

  backend-tests:
    runs-on: ubuntu-latest
    needs: test-scope
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.10.10
      - run: uv sync --project backend --group dev --locked
      - run: uv run --project backend pytest -c backend/pyproject.toml -m unit
      - run: uv run --project backend pytest -c backend/pyproject.toml -m api
      - if: needs.test-scope.outputs.full_tests == 'true'
        run: uv run --project backend pytest -c backend/pyproject.toml -m integration

  editor-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: editor/pnpm-lock.yaml
      - run: pnpm --dir editor install --frozen-lockfile
      - run: pnpm run test:editor:gate

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contracts

  runtime-delegated:
    runs-on: ubuntu-latest
    needs:
      - detect-runtime-change
      - test-scope
    if: needs.test-scope.outputs.full_tests == 'true' || needs.detect-runtime-change.outputs.runtime_changed == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: runtime/pnpm-lock.yaml
      - run: pnpm --dir runtime install --frozen-lockfile
      - run: pnpm run test:runtime:gate

  e2e-smoke:
    runs-on: ubuntu-latest
    needs:
      - test-scope
      - backend-tests
      - editor-tests
      - contracts
      - runtime-delegated
    if: needs.test-scope.outputs.full_tests == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ./.github/actions/setup-e2e
      - name: 执行分层 E2E
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            pnpm run test:e2e:all
          else
            pnpm run test:e2e
          fi
        env:
          TESTING_START_BACKEND: 'true'
          TESTING_START_EDITOR: 'true'
          TESTING_START_RUNTIME: 'true'
          AI_TEST_MODE: mock
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          retention-days: 14
          path: |
            test-results
            !test-results/e2e/storage-state.json

  platform-image-build-smoke:
    runs-on: ubuntu-latest
    needs:
      - test-scope
      - backend-tests
      - editor-tests
      - contracts
      - runtime-delegated
    if: needs.test-scope.outputs.full_tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full
            file: Dockerfile
            tag: web-presentation:ci-smoke
            cache_scope: platform
          - name: lite
            file: Dockerfile.lite
            tag: web-presentation:sqlite-lite-ci-smoke
            cache_scope: platform-lite
    name: platform-image-build-smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # main push 只验证 amd64；定时/手动全量运行时再覆盖多架构。
      - if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  gateway-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/testing/test-gateway-openapi.py

  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: web-presentation
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: LLMxPM/web-presentation-agent-kit
          path: web-presentation-agent-kit
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --project web-presentation/backend --group dev --locked
      - run: uv sync --project web-presentation-agent-kit --all-packages
      - working-directory: web-presentation
        run: uv run --project backend pytest -c backend/pyproject.toml backend/tests/contracts/test_cli_skill_examples.py
      - working-directory: web-presentation-agent-kit
        run: uv run pytest packages/cli/tests/test_backend_openapi_contract.py
