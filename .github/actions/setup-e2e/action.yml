# 文件功能：准备 GitHub Actions 中运行根仓 E2E 所需的 Node、Python、浏览器、预览域解析与服务依赖。
name: setup-e2e
description: 准备根仓 E2E 测试环境

inputs:
  uv-version:
    description: uv 版本
    required: false
    default: 0.10.10
  pnpm-version:
    description: pnpm 版本
    required: false
    default: 10.30.3

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        version: ${{ inputs.uv-version }}
        # 关闭 post 阶段的 `uv cache prune --ci`：E2E 会用 `uv run uvicorn` 拉起 Backend/Renderer 并保留到作业结束，
        # prune 需要独占缓存锁，会与常驻进程抢锁直到 300s 超时而让整个 e2e-smoke 作业判失败。
        # 缓存本身照常保存与恢复，只是不再在作业末尾裁剪。
        prune-cache: false

    - uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        check-latest: true
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml', 'uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-playwright-

    - run: pnpm install --frozen-lockfile
      shell: bash
    # E2E 会把本机 Runtime 地址改写成 preview.localhost；浏览器按 *.localhost 约定解析，
    # 但系统 DNS 与 Playwright ApiRequestContext 不遵循该约定，缺少 hosts 记录时报 getaddrinfo ENOTFOUND。
    - name: 配置预览域 hosts 解析
      run: bash .github/scripts/setup-preview-hosts.sh
      shell: bash
    - name: 启动 E2E 依赖
      run: bash .github/scripts/start-e2e-dependencies.sh
      shell: bash
    - run: uv sync --all-packages --all-groups --all-extras --locked
      shell: bash
    # 浏览器文件走缓存，但系统依赖仍需在每个全新 runner 上确认安装。
    - run: pnpm exec playwright install --with-deps chromium
      shell: bash
    - run: uv run --project renderer --no-sync playwright install --with-deps chromium
      shell: bash
