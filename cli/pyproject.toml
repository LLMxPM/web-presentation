[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-presentation-cli"
version = "0.1.0"
description = "Web Presentation CLI - 面向 AI 演示文稿创作平台的命令行与 Agent 工具包"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
wp = "wp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
