# 文件功能：runtime-all 兼容/Lite 生产编排模板（单 Runtime 进程同时承担 preview/build/check）。
#
# 官方生产主路径请使用 compose.runtime-roles.yml（分角色 runtime-preview / runtime-build / runtime-check，
# 最小权限 runtime.env、独立 CPU/内存 limits）。本模板保留给小团队、兼容部署和尚未迁移到分角色拓扑的环境。
# 两种模板不要混用同一套 deploy/.env 的角色目标变量语义；迁移步骤见 docs/developer/deployment/compose.md。

x-production-env: &production-env
  env_file:
    # 相对本文件目录 deploy/compose/，读取 deploy/.env
    - ../.env

services:
  backend-migrate:
    <<: *production-env
    image: llmxpm/web-presentation:latest
    restart: "no"
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]

  backend:
    <<: *production-env
    image: llmxpm/web-presentation:latest
    restart: unless-stopped
    working_dir: /app/backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - backend-data:/app/backend/data
    expose:
      - "8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
    secrets:
      - render_service_credential
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  renderer:
    # 不复用 *production-env：Renderer 不需要 DB/Redis/AI 等平台密钥。
    image: llmxpm/web-presentation-renderer:latest
    restart: unless-stopped
    environment:
      RENDER_WORKER_ID: "renderer-1"
      RENDER_SERVICE_CREDENTIAL_FILE: "/run/secrets/render_service_credential"
      RENDER_PROFILE_DIGEST: "profile.v1"
    expose:
      - "7400"
    secrets:
      - render_service_credential
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7400/livez >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

  runtime:
    <<: *production-env
    image: llmxpm/web-runtime-vue:latest
    restart: unless-stopped
    # 子进程降权（W01）：镜像内置 RUNTIME_BUILD_CHILD_UID/GID，主进程保持镜像默认 root 才能 setuid。
    expose:
      - "7373"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - const port=process.env.RUNTIME_SERVER_PORT||'7373'; fetch('http://127.0.0.1:'+port+'/__runtime_healthz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: llmxpm/web-presentation:latest
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  render_service_credential:
    file: ../secrets/render_service_credential

volumes:
  backend-data:
