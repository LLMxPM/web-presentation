# 文件功能：提供 SQLite + memory runtime 的轻量单容器部署编排模板，适合个人或小团队快速部署。
# 目标形态：单镜像单容器内含 Backend、Editor、Runtime、Renderer（内置 Chromium）与 Gateway，
# 实现「零必填变量、零密钥文件」一键启动。

# 访问地址说明：
# - 若部署在远程服务器或自定义域名，修改 BACKEND_PUBLIC_BASE_URL、RUNTIME_PUBLIC_BASE_URL 与 CORS_ORIGINS
#   为浏览器实际访问入口（如 http://your-domain.com:8080）。
# - 数据持久化：SQLite 数据库、上传资源、截图产物和持久化密钥统一保存在 lite-data 卷。
# - 管理员账号：首启若未指定 DEFAULT_ADMIN_PASSWORD，会自动生成强随机密码并输出到容器日志。

services:
  platform-lite:
    image: llmxpm/web-presentation:sqlite-lite
    restart: unless-stopped
    working_dir: /app/backend
    environment:
      BACKEND_PUBLIC_BASE_URL: "http://127.0.0.1:8080"
      RUNTIME_PUBLIC_BASE_URL: "http://127.0.0.1:8080/runtime"
      CORS_ORIGINS: '["http://127.0.0.1:8080"]'
    volumes:
      - lite-data:/app/backend/data
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1/healthz >/dev/null && curl -fsS http://127.0.0.1:8000/healthz >/dev/null && curl -fsS http://127.0.0.1:8000/readyz >/dev/null && curl -fsS http://127.0.0.1:7373/__runtime_healthz >/dev/null && curl -fsS http://127.0.0.1:7400/livez >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lite-data:
