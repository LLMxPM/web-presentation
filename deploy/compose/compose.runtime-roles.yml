# 文件功能：提供分角色单机部署编排模板，runtime-preview / runtime-build / runtime-check 各一实例，
# 配套 Renderer、Backend 与 Gateway，并为每个角色设置显式容器 CPU/内存 limits 与 Runtime 执行预算。

# 使用前请至少修改：
# - 复制 deploy/.env.example 为 deploy/.env，替换密钥、域名和外部依赖地址（同 compose.prod.yml）。
# - 复制 deploy/runtime.env.example 为 deploy/runtime.env，并按同一套域名/audience/JWKS 修改；
#   Runtime 三角色只读 runtime.env，不读 deploy/.env，避免平台密钥进入编译用户代码的容器。
#   runtime.env 中的 RUNTIME_PUBLIC_BASE_URL / audience / 路径必须与 deploy/.env 一致。
# - 生成并写入 deploy/secrets/build_worker_credential（强随机值），Backend 与 runtime-build
#   通过 secret 挂载同一文件；缺省时 claim fail-closed 且 Worker 不启动，构建会一直 pending。
# - 各角色与 Renderer 的 deploy.resources.limits 以及对应的 Runtime 执行预算为示例值，
#   必须按实测负载调整；取值依据见 docs/developer/deployment/compose.md「分角色单机」。
# - DEFAULT_ADMIN_PASSWORD、AI_SECRET_ENCRYPTION_KEY：正式部署前必须替换。
# - 暴露面约束：runtime-build / runtime-check 只挂 runtime-jobs-net，不发布宿主机端口；
#   公开 Gateway 只挂在 platform-net，且只把主机名 runtime 解析到 runtime-preview，
#   源码检查端点不经公开 Gateway 暴露，构建则根本没有入站 HTTP 端点。
# - RUNTIME_ROLE 由 Runtime 角色逻辑消费：preview 不开放诊断与轻量工具入口，
#   build 只跑构建领取 Worker，check 只保留诊断与轻量工具执行面。Backend 通过 RUNTIME_PREVIEW/CHECK_BASE_URL
#   按职责选址，未配置时回退 RUNTIME_BASE_URL；构建不经 Backend 选址，由 Worker 拉取。
# - 需要按实测瓶颈增加 build/check 副本时：复制对应角色服务并改独立别名。
#   build 副本只需启动即自行 claim，Backend 侧无需注册；check 副本要在 Backend
#   配置 RUNTIME_CHECK_BASE_URLS 注册全部副本，并按「副本数 × 单副本执行预算」
#   上调 RUNTIME_CHECK_MAX_INFLIGHT；详见 docs/developer/deployment/compose.md「计算副本扩容」。
# - 预览多副本（规划 T3-3）：Gateway 预览 upstream（runtime_preview_pool）已支持多实例，
#   复制 runtime-preview 服务为 runtime-preview-2（独立别名，不共享 runtime），
#   取消 nginx 配置中对应 server 注释并 reload；滚动发布顺序见
#   docs/developer/deployment/compose.md「预览多副本与滚动发布」。

x-production-env: &production-env
  env_file:
    # 相对本文件目录 deploy/compose/，读取 deploy/.env
    - ../.env

# Runtime 角色只注入非密钥配置。不得复用 *production-env：runtime-build / runtime-check
# 会编译用户手写 SFC，Vite transform/build 可执行作者代码；DATABASE_URL、REDIS_URL、
# AI_SECRET_ENCRYPTION_KEY、RUNTIME_RSA_PRIVATE_KEY 等平台密钥绝不能进入这些容器。
# 签名私钥只挂 Backend（RUNTIME_RSA_PRIVATE_KEY_FILE / secret），Runtime 仅读 JWKS。
# 可配置项（域名、audience、JWKS、路径）从 ../runtime.env 读取，禁止在本文件写死示例域名。
x-runtime-role-env: &runtime-role-env
  env_file:
    # 相对本文件目录 deploy/compose/，读取 deploy/runtime.env（复制 runtime.env.example）。
    - ../runtime.env

# 三个角色容器共用的探针；只看本进程，不依赖 Backend。
# 用 readyz 而不是 healthz：build 角色的凭证缺失或 Worker 未启动时，进程存活但
# 永远不会领取构建任务，必须让 healthcheck 失败，避免 depends_on 放行一个空转副本。
x-runtime-role-healthcheck: &runtime-role-healthcheck
  test:
    - CMD
    - node
    - -e
    - const port=process.env.RUNTIME_SERVER_PORT||'7373'; fetch('http://127.0.0.1:'+port+'/__runtime_readyz').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))
  interval: 10s
  timeout: 5s
  retries: 5

services:
  backend-migrate:
    <<: *production-env
    image: llmxpm/web-presentation:latest
    restart: "no"
    working_dir: /app/backend
    command: ["alembic", "upgrade", "head"]
    networks:
      - platform-net

  backend:
    <<: *production-env
    image: llmxpm/web-presentation:latest
    restart: unless-stopped
    working_dir: /app/backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      # 兼容回退：仍指向预览角色；角色目标未配置时 Backend 使用该地址。
      RUNTIME_BASE_URL: "http://runtime-preview:7373"
      # 分角色内部目标：预览 / 源码检查各自直达，不经公开 Gateway。
      # 构建不在这里注册：runtime-build 的 Worker 主动向 Backend claim 任务。
      RUNTIME_PREVIEW_BASE_URL: "http://runtime-preview:7373"
      RUNTIME_CHECK_BASE_URL: "http://runtime-check:7373"
      # 构建 Worker 共享服务凭证：与 runtime-build 使用同一 secret 文件。
      RUNTIME_BUILD_WORKER_CREDENTIAL_FILE: "/run/secrets/build_worker_credential"
    volumes:
      - backend-data:/app/backend/data
    expose:
      - "8000"
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
      runtime-preview:
        condition: service_healthy
      runtime-build:
        condition: service_healthy
      runtime-check:
        condition: service_healthy
    secrets:
      - render_service_credential
      - build_worker_credential
    networks:
      platform-net:
        aliases:
          - backend
      runtime-jobs-net:
        aliases:
          - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 示例值：Backend 只跑控制面；AI 页面队列与渲染队列预算仍由 deploy/.env 决定。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  renderer:
    # 不复用 *production-env：Renderer 不需要 DB/Redis/AI 等平台密钥。
    image: llmxpm/web-presentation-renderer:latest
    restart: unless-stopped
    environment:
      RENDER_WORKER_ID: "renderer-1"
      RENDER_SERVICE_CREDENTIAL_FILE: "/run/secrets/render_service_credential"
      RENDER_PROFILE_DIGEST: "profile.v1"
    expose:
      - "7400"
    secrets:
      - render_service_credential
    networks:
      platform-net:
        aliases:
          - renderer
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7400/livez >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 示例值：单槽 Chromium + 页面截图；并发上限由 RENDER_GLOBAL_CONCURRENCY 等执行预算决定。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  runtime-preview:
    # 不复用 *production-env：预览角色从 ../runtime.env 读非密钥配置，不注入平台密钥。
    <<: *runtime-role-env
    image: llmxpm/web-runtime-vue:latest
    restart: unless-stopped
    environment:
      RUNTIME_ROLE: "preview"
      # 预览执行预算：只保留轻量转换容量；构建/诊断入口应由角色逻辑拒绝。
      RUNTIME_VITE_TASK_CONCURRENCY: "2"
      RUNTIME_VITE_TASK_QUEUE_SIZE: "16"
      RUNTIME_VITE_TASK_QUEUE_WAIT_TIMEOUT_MS: "30000"
      # 版本指纹：排空/灰度时核对副本 build_id 与 /__runtime_healthz 输出一致。
      RUNTIME_BUILD_ID: "${RUNTIME_BUILD_ID:-}"
      RUNTIME_INSTANCE_ID: "runtime-preview-1"
    expose:
      - "7373"
    networks:
      platform-net:
        aliases:
          # Gateway Nginx 固定代理到主机名 runtime；分角色拓扑下该名字只解析到预览角色。
          - runtime
          - runtime-preview
    healthcheck: *runtime-role-healthcheck
    # 示例值：预览以模块转换与内存中的 Vite 模块图为主，无构建 Worker；
    # 2 CPU 保并发转换，2Gi 覆盖模块图与转换缓存。按预览请求峰值实测调整。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # 预览多副本示例（规划 T3-3）：取消注释后同步取消 nginx 中
  # upstream runtime_preview_pool 的第二条 server，并 reload gateway。
  # 注意：runtime-preview-2 不共享 runtime 别名，避免与单实例语义混淆。
  # runtime-preview-2:
  #   <<: *runtime-role-env
  #   image: llmxpm/web-runtime-vue:latest
  #   restart: unless-stopped
  #   environment:
  #     RUNTIME_ROLE: "preview"
  #     RUNTIME_VITE_TASK_CONCURRENCY: "2"
  #     RUNTIME_VITE_TASK_QUEUE_SIZE: "16"
  #     RUNTIME_VITE_TASK_QUEUE_WAIT_TIMEOUT_MS: "30000"
  #     RUNTIME_BUILD_ID: "${RUNTIME_BUILD_ID:-}"
  #     RUNTIME_INSTANCE_ID: "runtime-preview-2"
  #   expose:
  #     - "7373"
  #   networks:
  #     platform-net:
  #       aliases:
  #         - runtime-preview-2
  #   healthcheck: *runtime-role-healthcheck
  #   deploy:
  #     resources:
  #       limits:
  #         cpus: "2.0"
  #         memory: 2g

  runtime-build:
    # 不复用 *production-env：构建角色编译用户手写 SFC，绝不能注入 DB/Redis/AI/签名私钥。
    <<: *runtime-role-env
    image: llmxpm/web-runtime-vue:latest
    restart: unless-stopped
    environment:
      # 构建 Worker 共享服务凭证：与 Backend 使用同一 secret 文件（要求 0400/0600，仅属主可读）。
      # 构建只有 Worker 主动 claim/renew/complete 这一条执行路径；RUNTIME_ROLE=build 时凭证不可读
      # 或 RUNTIME_BACKEND_API_BASE_URL 缺失会让容器直接启动失败，而不是健康地空转。
      RUNTIME_BUILD_WORKER_CREDENTIAL_FILE: "/run/secrets/build_worker_credential"
      RUNTIME_ROLE: "build"
    # 子进程降权（W01）：镜像内置 RUNTIME_BUILD_CHILD_UID/GID=10001，主进程必须能 setuid。
    # 镜像默认 USER root；不要改成非 root 而不给有效 CAP_SETUID（cap_add 对非 root 无效，会 spawn EPERM）。
      # 构建执行预算：2 并发 × 2048MB 老生代 ≈ 4GiB 堆；容器 8g 另留约 4GiB 给 Buffer、
      # 归档（产物会整读进内存再压缩）、文件页与主进程。改并发或老生代时必须同步改 limits。
      # project lane 并发数即领取消费者数量：这里 2 表示单实例同时最多跑 2 个构建任务。
      RUNTIME_VITE_TASK_CONCURRENCY: "2"
      RUNTIME_VITE_TASK_QUEUE_SIZE: "8"
      RUNTIME_VITE_TASK_QUEUE_WAIT_TIMEOUT_MS: "30000"
      RUNTIME_BUILD_WORKER_MAX_OLD_SPACE_MB: "2048"
      RUNTIME_BUILD_WORKER_TIMEOUT_MS: "600000"
    expose:
      - "7373"
    # mode/uid/gid 必须写在服务级长语法：写在顶层 secrets 会被 Compose 忽略并退回 0444。
    # 主进程为 root 时 uid/gid 可省略；mode 0400 保证降权后的 rtchild 读不到。
    # 部分 Compose 忽略 mode 时，Runtime 启动会 chmod 0400 自动收紧；仍失败则 fail-closed。
    secrets:
      - source: build_worker_credential
        target: build_worker_credential
        uid: "0"
        gid: "0"
        mode: 0400
    networks:
      # 只挂内部任务网络：无宿主机端口，公开 Gateway 与预览角色都不可直达。
      runtime-jobs-net:
        aliases:
          - runtime-build
    healthcheck: *runtime-role-healthcheck
    # 示例值：CPU limits 取「可同时执行的构建 Worker 数 + 1 核主进程」；
    # 内存 limits ≈ 并发 × 老生代 + 等量非堆开销。按大项目归档峰值 RSS 实测调整。
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8g

  runtime-check:
    # 不复用 *production-env：检查角色同样编译用户手写 SFC，从 ../runtime.env 读非密钥配置。
    <<: *runtime-role-env
    image: llmxpm/web-runtime-vue:latest
    restart: unless-stopped
    environment:
      RUNTIME_ROLE: "check"
    # 诊断子进程同样按 RUNTIME_BUILD_CHILD_UID/GID 降权；主进程保持镜像默认 root。
      # 检查执行预算：诊断走完整 Vite 构建链路（write:false），按 2 并发 × 1536MB 老生代
      # ≈ 3GiB 堆配置；复用预热工作区并按 RSS 比例回收，控制常驻内存。
      RUNTIME_VITE_TASK_CONCURRENCY: "2"
      RUNTIME_VITE_TASK_QUEUE_SIZE: "32"
      RUNTIME_VITE_TASK_QUEUE_WAIT_TIMEOUT_MS: "30000"
      RUNTIME_VITE_DIAGNOSTICS_WEIGHT: "3"
      RUNTIME_BUILD_WORKER_MAX_OLD_SPACE_MB: "1536"
      RUNTIME_DIAGNOSTICS_WORKER_TIMEOUT_MS: "120000"
      RUNTIME_DIAGNOSTICS_WORKER_REUSE_ENABLED: "true"
      RUNTIME_DIAGNOSTICS_WORKER_MAX_TASKS: "25"
      RUNTIME_DIAGNOSTICS_WORKER_MAX_AGE_MS: "1800000"
      RUNTIME_DIAGNOSTICS_WORKER_RSS_RECYCLE_RATIO: "0.75"
    expose:
      - "7373"
    networks:
      # 只挂内部任务网络：无宿主机端口，公开 Gateway 与预览角色都不可直达。
      runtime-jobs-net:
        aliases:
          - runtime-check
    healthcheck: *runtime-role-healthcheck
    # 示例值：与构建同一套内存换算，另留工作区文件页与工作区池复用余量。
    # 交互诊断时延敏感，CPU 不宜低于构建单并发；按队列年龄与诊断 RSS 实测调整。
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 6g

  gateway:
    image: llmxpm/web-presentation:latest
    restart: unless-stopped
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      runtime-preview:
        condition: service_healthy
    networks:
      - platform-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 示例值：纯反向代理与静态资源托管。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

secrets:
  render_service_credential:
    file: ../secrets/render_service_credential
  # Runtime Build Worker 与 Backend 共用的内部服务凭证；文件内容为强随机字符串。
  # 生成示例：python -c "import secrets; print(secrets.token_urlsafe(32))"
  # 执行隔离（AR-01/W01）：mode/uid/gid 写在**服务级** secrets 长语法（见 runtime-build），
  # 对齐镜像内 rtworker（10000）；顶层 secrets 不接受 mode/uid/gid，写在这里会被忽略。
  # 宿主机文件仍建议 chmod 0400，并 chown 10000:10000（bind-mount 保留属主与权限）。
  # 详见 execution-isolation.md 与 compose.md。
  build_worker_credential:
    file: ../secrets/build_worker_credential

volumes:
  backend-data:

networks:
  # 公开入口网络：Gateway、Backend、预览角色与 Renderer；Gateway 只能通过主机名 runtime 到达预览。
  platform-net:
    name: web-presentation-roles
    driver: bridge
  # 内部任务网络：Backend 是唯一交点；构建与源码检查角色只出现在这里。
  runtime-jobs-net:
    name: web-presentation-roles-jobs
    driver: bridge
