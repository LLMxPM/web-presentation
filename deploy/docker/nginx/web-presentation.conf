# 文件功能：为平台镜像内的 Editor Gateway 提供静态资源托管与 Backend/Runtime 反向代理配置。
# 分角色单机（deploy/compose/compose.runtime-roles.yml）中主机名 runtime 只解析到 runtime-preview；
# 构建与源码检查角色不在本 Gateway 的可达网络内，不经公开入口暴露。
# 公开预览池走 upstream runtime_preview_pool：实例列表可更新、失败摘流、Upgrade 透传、可排空。

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_request_id $wp_request_id {
    default $http_x_request_id;
    '' $request_id;
}

log_format wp_json escape=json '{"ts":"$time_iso8601","level":"INFO","service":"gateway","module":"nginx.access","event":"http.request.completed","message":"Gateway 请求完成。","request_id":"$wp_request_id","method":"$request_method","path":"$uri","status_code":$status,"duration_seconds":$request_time,"upstream_status":"$upstream_status","upstream_response_time":"$upstream_response_time","remote_addr":"$remote_addr"}';

# 公开预览池：实例列表可直接编辑后 nginx -s reload 更新（不引入服务发现组件）。
# - max_fails/fail_timeout：被动健康摘流，连续失败的实例在窗口内不再路由，到期自动恢复。
# - proxy_next_upstream：单实例故障时把幂等子请求交给池内其它实例，避免整池失败。
# - 排空下线：先将待下线实例标记 down（或移出列表）并 reload，等在途连接/预览子请求结束后再停容器。
# - 滚动发布顺序见 docs/developer/deployment/compose.md「预览多副本与滚动发布」。
# - 软亲和（可选性能优化）：如需粘性可加 ip_hash；亲和不得成为正确性前提，任一副本都必须能独立服务全部预览子请求。
upstream runtime_preview_pool {
    server runtime:7373 max_fails=3 fail_timeout=10s;
    # 第二个预览副本示例：compose 中增加独立 runtime-preview-2（别名 runtime-preview-2）后取消注释并 reload。
    # server runtime-preview-2:7373 max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 100m;
    access_log off;
    error_log /dev/stderr warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /openapi.json {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wp_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_pass http://backend:8000;
    }

    location ~ ^/(api|public|build-artifacts|preview|media)(/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wp_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://backend:8000;
    }

    location = /runtime {
        return 301 /runtime/;
    }

    location /runtime/ {
        proxy_http_version 1.1;
        proxy_set_header Host runtime;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wp_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors off;
        # 失败摘流后把可重试请求交给池内其它预览副本；Upgrade 成功后的长连接不重试。
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://runtime_preview_pool;
    }

    location ~ ^/(?:@vite|@id|@fs|@runtime-preview|node_modules/\.vite|src)(?:/|$) {
        proxy_http_version 1.1;
        proxy_set_header Host runtime;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wp_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://runtime_preview_pool;
    }

    location ~ ^/(?:__vite_ping|__preview-tailwind\.css|__runtime-snapdom-resource-proxy)(?:\?|$) {
        proxy_http_version 1.1;
        proxy_set_header Host runtime;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $wp_request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_intercept_errors off;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_pass http://runtime_preview_pool;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
