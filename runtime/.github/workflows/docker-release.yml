name: runtime-docker-release

permissions:
  contents: read

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 要发布到 Docker Hub 的镜像标签，例如 v1.2.3
        required: true
        type: string
      push_latest:
        description: 是否同时推送 latest 标签
        required: true
        default: false
        type: boolean

jobs:
  release-meta:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      push_latest: ${{ steps.meta.outputs.push_latest }}
      checkout_ref: ${{ steps.meta.outputs.checkout_ref }}
    steps:
      - id: meta
        env:
          EVENT_RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            release_tag="${EVENT_RELEASE_TAG}"
            checkout_ref="${EVENT_RELEASE_TAG}"
            if [ "${EVENT_RELEASE_PRERELEASE}" = "true" ]; then
              push_latest="false"
            else
              push_latest="true"
            fi
          else
            release_tag="${INPUT_RELEASE_TAG}"
            checkout_ref="${INPUT_RELEASE_TAG}"
            push_latest="${INPUT_PUSH_LATEST}"
          fi

          if [ -z "${release_tag}" ]; then
            echo "release_tag 不能为空。" >&2
            exit 1
          fi

          echo "release_tag=${release_tag}" >> "${GITHUB_OUTPUT}"
          echo "push_latest=${push_latest}" >> "${GITHUB_OUTPUT}"
          echo "checkout_ref=${checkout_ref}" >> "${GITHUB_OUTPUT}"

  check-test-build:
    runs-on: ubuntu-latest
    needs: release-meta
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - release-meta
      - check-test-build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-meta.outputs.checkout_ref }}
      - id: revision
        run: |
          runtime_sha="$(git rev-parse HEAD)"
          runtime_short_sha="${runtime_sha:0:12}"
          echo "runtime_sha=${runtime_sha}" >> "${GITHUB_OUTPUT}"
          echo "runtime_short_sha=${runtime_short_sha}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.ACR_REGISTRY }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # 为两个目标仓库分别生成标签，避免 ACR 推送时携带 Docker Hub 专用元数据。
      - id: meta-dockerhub
        name: 生成 Docker Hub 镜像元数据
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ vars.DOCKERHUB_NAMESPACE }}/web-runtime-vue
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=sha-${{ steps.revision.outputs.runtime_short_sha }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-runtime-vue
            org.opencontainers.image.description=Runtime service for web-presentation preview, diagnostics and build
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.runtime_sha }}

      - id: meta-acr
        name: 生成 ACR 镜像元数据
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}/web-runtime-vue
          tags: |
            type=raw,value=${{ needs.release-meta.outputs.release_tag }}
            type=raw,value=sha-${{ steps.revision.outputs.runtime_short_sha }}
            type=raw,value=latest,enable=${{ needs.release-meta.outputs.push_latest == 'true' }}
          labels: |
            org.opencontainers.image.title=web-runtime-vue
            org.opencontainers.image.description=Runtime service for web-presentation preview, diagnostics and build
            org.opencontainers.image.version=${{ needs.release-meta.outputs.release_tag }}
            org.opencontainers.image.revision=${{ steps.revision.outputs.runtime_sha }}

      - name: 构建并推送 Docker Hub 镜像（含 SBOM 和 provenance）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          annotations: ${{ steps.meta-dockerhub.outputs.annotations }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 个人版/旧版 ACR 不接受 provenance 和 SBOM 生成的 OCI 附件，因此单独推送普通镜像。
      - name: 构建并推送 ACR 镜像（不含 OCI 附件）
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-acr.outputs.tags }}
          labels: ${{ steps.meta-acr.outputs.labels }}
          annotations: ${{ steps.meta-acr.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
