# 文件功能：Runtime 独立运行的路由 fixture，按能力章节组织本地示例页，覆盖 Runtime Kit 全部公开能力。
transitionDefaults:
  effect: fade
  durationMs: 400

playback:
  schemaVersion: 4
  loop: false
  advanceDefaults:
    mode: manual
    delayMs: 5000

routes:
  - route: home
    component: '@/examples/local/views/defaultpage/HomePage.vue'
    meta:
      title: 首页
      order: 0

  - route: contents
    component: '@/examples/local/views/defaultpage/TableOfContentsPage.vue'
    meta:
      title: 目录
      order: 1
      transition:
        effect: push
        durationMs: 400

  - route: capabilities
    component: '@/examples/local/views/feature-showcase/Index.vue'
    meta:
      title: 能力总览
      order: 2

  - route: assets
    meta:
      title: 资源渲染
      order: 3
    children:
      - route: image
        component: '@/examples/local/views/feature-showcase/assets/ImageShowcase.vue'
        meta:
          title: 图片与资源解析
          order: 0
      - route: video
        component: '@/examples/local/views/feature-showcase/assets/VideoShowcase.vue'
        meta:
          title: 视频渲染
          order: 1
      - route: audio
        component: '@/examples/local/views/feature-showcase/assets/AudioShowcase.vue'
        meta:
          title: 音频与音效
          order: 2
      - route: chart
        component: '@/examples/local/views/feature-showcase/assets/ChartShowcase.vue'
        meta:
          title: ECharts 图表
          order: 3
      - route: mermaid
        component: '@/examples/local/views/feature-showcase/assets/MermaidShowcase.vue'
        meta:
          title: Mermaid 图表
          order: 4
      - route: drawio
        component: '@/examples/local/views/feature-showcase/assets/DrawioShowcase.vue'
        meta:
          title: Draw.io 图表
          order: 5
      - route: formula
        component: '@/examples/local/views/feature-showcase/assets/FormulaShowcase.vue'
        meta:
          title: LaTeX 公式
          order: 6
      - route: model
        component: '@/examples/local/views/feature-showcase/assets/ModelShowcase.vue'
        meta:
          title: 三维模型
          order: 7

  - route: page-runtime
    meta:
      title: 页面与路由
      order: 4
    children:
      - route: canvas
        component: '@/examples/local/views/feature-showcase/page/CanvasShowcase.vue'
        meta:
          title: 页面画布
          order: 0
      - route: routing
        component: '@/examples/local/views/feature-showcase/page/RoutingShowcase.vue'
        meta:
          title: 路由与导航
          order: 1

  - route: runtime-kit
    meta:
      title: 运行时能力
      order: 5
    children:
      - route: theme
        component: '@/examples/local/views/feature-showcase/runtime/ThemeShowcase.vue'
        meta:
          title: 主题与配色
          order: 0
      - route: icons
        component: '@/examples/local/views/feature-showcase/runtime/IconShowcase.vue'
        meta:
          title: 图标与 Logo
          order: 1
      - route: data-table
        component: '@/examples/local/views/feature-showcase/runtime/DataTableShowcase.vue'
        meta:
          title: DataTable 表格
          order: 2
      - route: connector
        component: '@/examples/local/views/feature-showcase/runtime/ConnectorShowcase.vue'
        meta:
          title: DOM 连线
          order: 3
      - route: scene
        component: '@/examples/local/views/feature-showcase/runtime/SceneShowcase.vue'
        meta:
          title: 场景与动效
          order: 4
          advance:
            mode: scene_end
            delayMs: 5000
            completionDelayMs: 300

  - route: endpage
    component: '@/examples/local/views/defaultpage/EndPage.vue'
    meta:
      title: 末页
      order: 100
